name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libtesseract-dev libleptonica-dev pkg-config libxcb-cursor0 libegl1 libxkbcommon-x11-0
      - run: pip install -e ".[dev]"
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q -W ignore::DeprecationWarning

  linux:
    needs: test
    runs-on: ubuntu-22.04          # older glibc = runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libtesseract-dev libleptonica-dev pkg-config libxcb-cursor0
      - run: pip install . pyinstaller
      - name: Bundle English OCR data
        run: |
          mkdir -p packaging/bundle/tessdata
          curl -sSL -o packaging/bundle/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
      - run: pyinstaller packaging/subbridge.spec --noconfirm
      - name: Self-test of the packaged app
        run: QT_QPA_PLATFORM=offscreen dist/SubBridge/subbridge --selftest selftest.json; cat selftest.json
      - run: packaging/build_deb.sh
      - run: tar -C dist -czf dist/SubBridge-linux-x86_64.tar.gz SubBridge
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller
      - name: Tesseract (bundled next to the app)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          New-Item -ItemType Directory -Force packaging/bundle | Out-Null
          Copy-Item -Recurse "C:\Program Files\Tesseract-OCR" packaging/bundle/tesseract
          New-Item -ItemType Directory -Force packaging/bundle/tessdata | Out-Null
          Invoke-WebRequest -Uri https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata -OutFile packaging/bundle/tessdata/eng.traineddata
      - run: pyinstaller packaging/subbridge.spec --noconfirm
      - name: Self-test of the packaged app
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\SubBridge\SubBridge.exe" -ArgumentList "--selftest", "selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Installer
        shell: pwsh
        run: |
          $v = (Select-String -Path subbridge/branding.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$v packaging\windows\subbridge.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  android:
    needs: test
    runs-on: ubuntu-24.04
    env:
      HAS_KS: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - name: Signing key (optional repository secrets)
        if: env.HAS_KS == 'true'
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: echo "$KS" | base64 -d > android/app/release.keystore
      - name: Build APK
        working-directory: android
        env:
          SB_KEYSTORE: ${{ env.HAS_KS == 'true' && 'release.keystore' || '' }}
          SB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -z "$SB_KEYSTORE" ] && unset SB_KEYSTORE
          chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../SubBridge-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: SubBridge-android.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
