[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subbridge"
version = "0.1.6"
description = "Live game subtitle OCR and translation, streamed to your phone"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "numpy",
  "pillow",
  "tesserocr; sys_platform != 'win32'",
  "ctranslate2",
  "sentencepiece",
  "sacremoses",
  "subword-nmt",
  "aiohttp",
  "qrcode",
  "cryptography",
  "zeroconf",
  "python-xlib; sys_platform == 'linux'",
]

[project.optional-dependencies]
rapidocr = ["rapidocr-onnxruntime"]
dev = ["pytest", "pyflakes"]

[project.scripts]
subbridge = "subbridge.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["subbridge*"]

[tool.setuptools.package-data]
subbridge = ["assets/**/*", "server/web/**/*", "server/web/*"]
