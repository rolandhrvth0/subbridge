<!doctype html>
<html lang="hu" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SubBridge">
<title>SubBridge</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
  </defs>
</svg>

<!-- pairing -->
<section id="pair" class="screen" hidden>
  <div class="pair-card">
    <img src="/static/icon.svg" alt="" class="pair-logo" width="56" height="56">
    <h1 data-i18n="pair_title">Csatlakozás</h1>
    <p class="muted" data-i18n="pair_text">Írd be a számítógépen látható 6 jegyű PIN-kódot.</p>
    <form id="pin-form" autocomplete="off">
      <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" aria-label="PIN" autofocus>
      <button type="submit" class="btn primary" data-i18n="pair_btn">Csatlakozás</button>
    </form>
    <p id="pair-error" class="error" role="alert"></p>
  </div>
</section>

<!-- subtitles -->
<main id="app" class="screen" hidden>
  <header class="bar">
    <div class="conn" id="conn"><span class="dot"></span><span id="conn-text"></span></div>
    <div class="bar-actions">
      <button class="icon-btn" id="btn-tts" aria-label="Felolvasás"><svg><use href="#i-mute"/></svg></button>
      <button class="icon-btn" id="btn-full" aria-label="Teljes képernyő"><svg><use href="#i-expand"/></svg></button>
      <button class="icon-btn" id="btn-settings" aria-label="Beállítások"><svg><use href="#i-settings"/></svg></button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="stage">
    <ol id="log" aria-live="polite" aria-label="Feliratok"></ol>
    <button id="jump" class="jump" hidden><span data-i18n="jump">Új felirat</span></button>
    <section id="gphone" class="gphone" hidden aria-live="polite">
      <header><span class="tag" data-i18n="phone_tag">Telefon a játékban</span><b id="gphone-head"></b></header>
      <div id="gphone-list"></div>
    </section>
    <div id="empty" class="empty">
      <svg><use href="#i-monitor"/></svg>
      <p id="empty-text" data-i18n="waiting">Várakozás feliratra…</p>
    </div>
  </div>
</main>

<!-- settings sheet -->
<div id="sheet-backdrop" hidden></div>
<aside id="sheet" aria-hidden="true">
  <div class="sheet-head">
    <h2 data-i18n="settings">Beállítások</h2>
    <button class="icon-btn" id="sheet-close" aria-label="Bezárás"><svg><use href="#i-x"/></svg></button>
  </div>
  <div class="sheet-body">
    <h3 data-i18n="s_display">Megjelenítés</h3>
    <label class="row"><span data-i18n="s_size">Betűméret</span><input type="range" id="s-size" min="16" max="72" step="1"><output id="s-size-v"></output></label>
    <label class="row"><span data-i18n="s_font">Betűtípus</span>
      <select id="s-font"><option value="inter">Inter</option><option value="system" data-i18n="f_system">Rendszer</option><option value="serif">Serif</option><option value="mono">Mono</option></select></label>
    <label class="row"><span data-i18n="s_theme">Háttér</span>
      <select id="s-theme"><option value="dark" data-i18n="t_dark">Sötét</option><option value="black" data-i18n="t_black">Fekete (OLED)</option><option value="light" data-i18n="t_light">Világos</option></select></label>
    <label class="row"><span data-i18n="s_color">Szövegszín</span>
      <select id="s-color"><option value="default" data-i18n="c_default">Alap</option><option value="yellow" data-i18n="c_yellow">Sárga</option><option value="white" data-i18n="c_white">Fehér</option><option value="green" data-i18n="c_green">Zöld</option></select></label>
    <label class="row"><span data-i18n="s_align">Igazítás</span>
      <select id="s-align"><option value="center" data-i18n="a_center">Középre</option><option value="left" data-i18n="a_left">Balra</option></select></label>
    <label class="row switch"><span data-i18n="s_original">Eredeti szöveg mutatása</span><input type="checkbox" id="s-original"></label>
    <label class="row switch"><span data-i18n="s_history">Előzmények mutatása</span><input type="checkbox" id="s-history"></label>
    <label class="row"><span data-i18n="s_lines">Előzmények száma</span><input type="range" id="s-lines" min="1" max="10" step="1"><output id="s-lines-v"></output></label>
    <label class="row"><span data-i18n="s_autoclear">Automatikus törlés</span>
      <select id="s-autoclear"><option value="0" data-i18n="ac_off">Ki</option><option value="10">10 mp</option><option value="20">20 mp</option><option value="40">40 mp</option></select></label>

    <h3 data-i18n="s_tts">Felolvasás</h3>
    <label class="row switch"><span data-i18n="s_tts_on">Felolvasás bekapcsolva</span><input type="checkbox" id="s-tts"></label>
    <label class="row"><span data-i18n="s_voice">Hang</span><select id="s-voice"></select></label>
    <label class="row"><span data-i18n="s_rate">Sebesség</span><input type="range" id="s-rate" min="0.6" max="2" step="0.1"><output id="s-rate-v"></output></label>
    <label class="row"><span data-i18n="s_volume">Hangerő</span><input type="range" id="s-volume" min="0" max="1" step="0.05"><output id="s-volume-v"></output></label>
    <label class="row switch"><span data-i18n="s_interrupt">Új felirat megszakítja a régit</span><input type="checkbox" id="s-interrupt"></label>
    <label class="row switch"><span data-i18n="s_speakname">Beszélő nevének felolvasása</span><input type="checkbox" id="s-speakname"></label>
    <label class="row switch"><span data-i18n="s_pitch">Beszélőnként más hangmagasság</span><input type="checkbox" id="s-pitch"></label>

    <h3 data-i18n="s_device">Eszköz</h3>
    <label class="row switch"><span data-i18n="s_wake">Képernyő ébren tartása</span><input type="checkbox" id="s-wake"></label>
    <p class="hint" id="wake-hint" hidden></p>
    <label class="row"><span data-i18n="s_lang">Nyelv</span>
      <select id="s-lang"><option value="hu">Magyar</option><option value="en">English</option></select></label>
    <p class="hint" data-i18n="install_hint">Tipp: a böngésző „Hozzáadás a kezdőképernyőhöz” menüjével alkalmazásként is elindíthatod.</p>
    <button class="btn ghost" id="btn-forget" data-i18n="forget">Kapcsolat elfelejtése</button>
  </div>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
